      min-height: 540px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .slide-badge {
      background: rgba(255, 103, 31, 0.15);
      color: var(--saffron);
      border: 1px solid rgba(255, 103, 31, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .slide-counter {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }
    .slide-content {
      flex: 1;
    }
    .slide-title {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .slide-subtitle {
      font-size: 16px;
      color: var(--saffron);
      margin-bottom: 24px;
      font-weight: 600;
    }
    .slide-body {
      font-size: 15px;
      color: #CBD5E1;
      line-height: 1.6;
    }
    .slide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .grid-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
    }
    .grid-box h4 {
      color: var(--saffron);
      font-size: 15px;
      margin-bottom: 6px;
    }
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }
    .nav-btn {
      background: #1E2D44;
      color: #FFFFFF;
      border: 1px solid var(--border);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--saffron);
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .back-home {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .back-home:hover {

    let currentSlide = 0;

    function renderSlide(index) {
      const s = slides[index];
      document.getElementById("slideCounter").innerText = `Slide ${index + 1} of ${slides.length}`;
      document.getElementById("slideContent").innerHTML = `
        <div class="slide-title">${s.title}</div>
        <div class="slide-subtitle">${s.subtitle}</div>
        <div class="slide-body">${s.body}</div>
      `;
      document.getElementById("prevBtn").disabled = index === 0;
      document.getElementById("nextBtn").disabled = index === slides.length - 1;
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    });

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        if (currentSlide < slides.length - 1) {
          currentSlide++;
          renderSlide(currentSlide);
        }
      } else if (e.key === "ArrowLeft") {
        if (currentSlide > 0) {
          currentSlide--;
          renderSlide(currentSlide);
        }
      }
    });

    renderSlide(currentSlide);
  </script>
</body>
</html>
